name: 🐛 Bug report
description: Report a reproducible problem in Student OS
title: "[Bug]: "
labels: ["bug", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much detail as you can.
  - type: checkboxes
    attributes:
      label: Prerequisites
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I am running the latest version.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Web (installed PWA)
        - Android app
        - Desktop browser
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you on? (See Settings)
      placeholder: e.g. 1.2.0
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Screenshots / console output
      description: Add screenshots or paste relevant logs.
      render: shell
    validations:
      required: false
